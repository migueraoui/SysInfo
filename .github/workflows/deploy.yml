name: Déployer sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Construire le site (validation du contenu, build, liens, fichiers privés)
        uses: withastro/action@v6
        with:
          node-version: 22
          build-cmd: npm run build && npm run linkcheck && npm run audit:private

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer
        id: deployment
        uses: actions/deploy-pages@v5
